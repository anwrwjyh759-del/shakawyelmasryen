<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شكاوي نار</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Cairo',sans-serif;background:#0f172a;color:#e2e8f0;text-align:center;padding:15px;margin:0}
  .container{max-width:500px;margin:auto}
  h2{color:#ef4444}
  select,button,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px;font-family:inherit}
  button{background:#ef4444;color:white;font-weight:bold;cursor:pointer}
  button:disabled{background:#475569}
  .box{background:#1e293b;padding:15px;border-radius:10px;margin-top:15px;text-align:right;white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">
  <h2>📍 شكاوي نار</h2>
  <p>اختار نوع المشكلة وهو هيكتبلك الصيغة الرسمية جاهزة للنسخ</p>

  <select id="type">
    <option value="حفرة في الطريق">حفرة في الطريق</option>
    <option value="تراكم قمامة">تراكم قمامة</option>
    <option value="انقطاع مياه">انقطاع مياه</option>
    <option value="كسر في عمود إنارة">كسر في عمود إنارة</option>
    <option value="أخرى">أخرى</option>
  </select>

  <textarea id="details" rows="3" placeholder="اكتب تفاصيل زيادة لو حابب"></textarea>

  <button id="btn" onclick="makeComplaint()">اكتب الشكوى</button>

  <div id="output" class="box">الشكوى هتظهر هنا</div>
</div>

<script>
function makeComplaint() {
  const type = document.getElementById('type').value;
  const details = document.getElementById('details').value;
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('output').innerText = 'جاري كتابة الشكوى...';

  let locationText = "لم يتم تحديد الموقع";
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos){
      locationText = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
      showComplaint(type, details, locationText);
    }, function(){
      showComplaint(type, details, locationText);
    });
  } else {
    showComplaint(type, details, locationText);
  }
}

function showComplaint(type, details, locationText){
  let description = type;
  if(details.trim().length > 0){
    description = type + " - " + details.trim();
  }

  const complaint = `إلى السيد/ رئيس الحي المختص
تحية طيبة وبعد،

أتقدم بشكوى بخصوص: ${description}

الموقع: ${locationText}
تاريخ البلاغ: ${new Date().toLocaleDateString('ar-EG')}

برجاء التكرم باتخاذ اللازم وإفادتي برقم الشكوى.

وتفضلوا بقبول فائق الاحترام
مقدمه/ مواطن`;

  document.getElementById('output').innerText = complaint;
  document.getElementById('btn').disabled = false;
}
</script>
</body>
</html>
